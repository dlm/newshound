[project]
name = "newshound"
version = "0.1.0"
description = "Autonomous agent that scrapes, scores, and serves a personal RSS feed"
readme = "README.md"
authors = [
    { name = "David Millman", email = "dave@cs.unc.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "litellm>=1.50",
    "crawl4ai>=0.4",
    "feedgen>=1.0",
]

[project.scripts]
newshound = "newshound:main"

[dependency-groups]
# uv installs these automatically with `uv run` / `uv sync` - unlike an
# optional extra, which needs --all-extras and silently breaks a clean
# checkout (CI) while working on a dev machine that already synced.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newshound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external service (LLM API, live site) - costs money/time, non-deterministic",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
